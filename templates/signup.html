<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Sign Up</title>
    <link rel="stylesheet" href="{{url_for('static', filename='signup.css')}}">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
  <div class="container-fluid">
    <!-- Replace the text and div with an img tag -->
    <a class="navbar-brand" href="/">
      <img src="../static/logo (2).png" alt="Portfolio Map Logo" class="custom-nav-logo">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/login">LOGIN</a></li>
        <li class="nav-item"><a class="nav-link" href="/signup">SIGN UP</a></li>
      </ul>
    </div>
  </div>
</nav>

    <div class="signup">
        <h1>SIGN UP</h1>
        <form action="/signup" method="POST">

        <label for="username" style="color: white; font-weight:200; font-size: x-large;">Username</label>
        <input type="text" id="username" class="custom-input" placeholder="Username" name="username"><br>

        <label for="password" style="color: white; font-weight:200; font-size: x-large;">Password</label>
        <input type="password" id="password" class="custom-input" placeholder="Password" name="password"><br>

        <button class="button" type="submit">Sign Up</button>
        </form>
    </div>

</body>
</html>
