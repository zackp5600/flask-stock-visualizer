<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Home page</title>
    <link rel="stylesheet" href="{{url_for('static', filename='dashboard.css')}}">
</head>
<body>
  <dialog id="dig">
    <h1>Stock is being added...</h1>
  </dialog>
<nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <img src="../static/logo (2).png" alt="Portfolio Map Logo" class="custom-nav-logo">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/login">LOGIN</a></li>
        <li class="nav-item"><a class="nav-link" href="/signup">SIGN UP</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="Portfolio">
  <h1>PORTFOLIO</h1>
  <h2>{{user.username.upper()}}'s Account</h2>
  {% for stock in portfolio %}
  <h3>Ticker: {{stock.symbol}}</h3>
  <h5>Shares: {{stock.shares}}</h5>
  <h5>Average Price: ${{stock.avg_price}}</h5>
  {% else %}
  <h3>Your not tracking any stocks right now</h3>
  {% endfor %}
</div>

<div class="info">
    <h1>
        Enter stock: 
    </h1>
    <form action="/dashboard" method="POST">
        <label for="ticker" style="color: white;">Enter stock</label>
    <input type="text" class="ticker" name="ticker"> <br>
        <label for="shares" style="color: white;">Add shares</label>
    <input type="number" class="shares" name="shares">
    <br>
    <label for="avg_price" style="color: white;">Add Average Price</label>
    <input type="number" step="0.01" class="avg_price" name="avg_price"><br>
    <button type="submit" action="popup" id="btn">Add Stock</button>
</form>
</div>
<script>
  button = document.getElementById("btn");
  dialog = document.getElementById("dig")
  button.addEventListener('click', () =>{
    dialog.showModal();
  })


</script>
</body>
</html>
